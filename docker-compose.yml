# Optional containerised setup. Local development without Docker is the
# primary workflow; see README.md.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/carbon_copy.db
      FRONTEND_URL: http://localhost:5173
    volumes:
      - backend-data:/data

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      # The browser runs on the host, so it reaches the API via the published port.
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend-data:
  frontend-node-modules:
